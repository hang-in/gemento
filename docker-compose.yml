version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: gemento-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: always

volumes:
  redis_data:
    driver: local
